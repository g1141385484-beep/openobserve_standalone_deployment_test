server {
    listen       8084;
    listen  [::]:8084;
    server_name  localhost;

    access_log  /var/log/nginx/traceing.access.log json_combined;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
   location = /status {
    stub_status on;
    #access_log off;
    allow all;
   }
    location ^~ /api/orders {
        access_log /var/log/nginx/order.log json_combined;
        proxy_pass http://192.168.223.111:8082;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.223.111:8082;
        proxy_set_header Origin http://localhost:3080;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
