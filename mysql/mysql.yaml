version: "3.7"
services:
  mysql:
    image: mysql:5.7.44
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=Hzdk@123
      - TZ=Asia/Shanghai
    volumes:
      - ./data/:/var/lib/mysql
      - ./conf/my.cnf:/etc/mysql/my.cnf
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime
      - ./logs/:/var/log/mysql
    ports:
      - '3306:3306'
